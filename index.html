<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arb Scanner 3.0</title>
<style>
body {
 background:#0b1220;
 color:white;
 font-family:Arial,sans-serif;
 padding:18px;
 max-width:800px;
 margin:auto;
}
h1 {color:#38e8a0;}
label {display:block;margin-top:14px;}
input,select,button {
 box-sizing:border-box;
 width:100%;
 padding:13px;
 margin:8px 0;
 border:1px solid #334155;
 border-radius:10px;
 font-size:16px;
 background:#1e293b;
 color:white;
}
button {
 background:#16a34a;
 font-weight:bold;
}
button:disabled {opacity:0.5;}
.result {
 background:#1e293b;
 padding:16px;
 margin:12px 0;
 border-radius:12px;
}
.profit {color:#38e8a0;font-size:22px;}
small {color:#94a3b8;display:block;line-height:1.5;margin:10px 0;} .result a{display:inline-block;margin:5px 0;}
</style>
</head>
<body>

<h1>ARB SCANNER 3.0</h1>
<p>Gate.io + Bybit</p>

<label>Капитал USDT</label>
<input id="capital" type="number" value="1000">

<label>Минимальная прибыль %</label>
<input id="minimum" type="number" value="2">

<label>Комиссия Gate %</label>
<input id="gateFee" type="number" value="0.1" step="0.01">

<label>Комиссия Bybit %</label>
<input id="bybitFee" type="number" value="0.1" step="0.01">

<label>Резерв расходов на оба перевода (USDT)</label>
<input id="transfer" type="number" value="2">

<label>Адрес сервера проверки сетей (HTTPS, необязательно)</label><input id="backend" type="url" placeholder="https://...workers.dev"><label>Тип арбитража</label>
<select id="mode">
<option value="all">Все связки</option>
<option value="cross">Межбиржевой</option>
<option value="triangle">Треугольный</option>
<option value="mixed">Комбинированный</option>
</select>

<button id="scan">НАЧАТЬ СКАНИРОВАНИЕ</button>
<button id="auto">Автообновление: выключено</button><p id="status">Готов к запуску</p>
<small>Проверка стаканов до 50 уровней. Для автоматической проверки сетей подключите сервер. Без него межбиржевые сигналы остаются неподтверждёнными. Автоматических сделок нет.</small>
<label><input id="unverified" type="checkbox" style="width:auto"> Показать неподтверждённые межбиржевые сигналы</label><div id="results"></div>

<script>
const $ = id => document.getElementById(id);
$("backend").value=localStorage.getItem("arbBackend")||"";
$("backend").onchange=()=>localStorage.setItem("arbBackend",$("backend").value.trim());

async function request(url) {
 const controller = new AbortController();
 const timer = setTimeout(
  () => controller.abort(), 20000
 );
 try {
  const r = await fetch(url, {
   signal:controller.signal
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
 } finally {
  clearTimeout(timer);
 }
}

async function gate() {
 const [ticks,pairs] = await Promise.all([
  request("https://api.gateio.ws/api/v4/spot/tickers"),
  request("https://api.gateio.ws/api/v4/spot/currency_pairs")
 ]);
 const active = new Map(
  pairs.filter(p=>p.trade_status==="tradable")
  .map(p=>[p.id,p])
 );
 return ticks.filter(t=>active.has(t.currency_pair))
 .map(t=>({
  symbol:t.currency_pair, base:active.get(t.currency_pair).base,
  quote:active.get(t.currency_pair).quote,
  bid:Number(t.highest_bid),
  ask:Number(t.lowest_ask)
 }));
}

async function bybit() {
 const t = await request(
  "https://api.bybit.com/v5/market/tickers?category=spot"
 );
 if(t.retCode!==0) throw new Error(t.retMsg);
 let cursor="", pairs=[];
 do {
  const p=await request(
   "https://api.bybit.com/v5/market/instruments-info?category=spot"
   +(cursor?"&cursor="+encodeURIComponent(cursor):"")
  );
  if(p.retCode!==0) throw new Error(p.retMsg);
  pairs.push(...p.result.list);
  cursor=p.result.nextPageCursor||"";
 } while(cursor);

 const active=new Map(
  pairs.filter(p=>p.status==="Trading")
  .map(p=>[p.symbol,p])
 );

 return t.result.list
 .filter(x=>active.has(x.symbol))
 .map(x=>({
  symbol:x.symbol, base:active.get(x.symbol).baseCoin,
  quote:active.get(x.symbol).quoteCoin,
  bid:Number(x.bid1Price),
  ask:Number(x.ask1Price)
 }));
}


const names=["Gate","Bybit"];
const api="https://api.gateio.ws/api/v4";
function graph(rows,i,fee){
 const g=new Map();
 function add(a,b,e){if(!g.has(a))g.set(a,new Map());g.get(a).set(b,e);}
 for(const x of rows)if(x.bid>0&&x.ask>=x.bid){
 add(x.base,x.quote,{i,x,buy:false,rate:x.bid*(1-fee),fee});
 add(x.quote,x.base,{i,x,buy:true,rate:(1-fee)/x.ask,fee});
 }return g;
}
function fill(amount,levels,buy,fee){
 let out=0,left=amount;
 for(const [p0,q0] of levels){const p=Number(p0),q=Number(q0);if(!(p>0&&q>0))continue;
 const used=Math.min(left,buy?p*q:q);left-=used;out+=buy?used/p:used*p;if(left<=amount*1e-9)break;}
 return left>amount*1e-9?null:out*(1-fee);
}
async function book(e){
 if(e.i===0){const b=await request(api+"/spot/order_book?limit=50&currency_pair="+encodeURIComponent(e.x.symbol));return e.buy?b.asks:b.bids;}
 const b=await request("https://api.bybit.com/v5/market/orderbook?category=spot&limit=50&symbol="+encodeURIComponent(e.x.symbol));if(b.retCode!==0)throw Error(b.retMsg);return e.buy?b.result.a:b.result.b;
}
function link(e){return e.i===0?"https://www.gate.com/trade/"+encodeURIComponent(e.x.symbol):"https://www.bybit.com/en/trade/spot/"+encodeURIComponent(e.x.base)+"/"+encodeURIComponent(e.x.quote);}
let busy=false,auto=null;
$("auto").onclick=()=>{if(auto){clearInterval(auto);auto=null;}else{auto=setInterval(scan,15000);scan();}$("auto").textContent="Автообновление: "+(auto?"включено":"выключено");};
$("scan").onclick=scan;
async function scan(){
 if(busy)return;busy=true;$("scan").disabled=true;$("results").replaceChildren();$("status").textContent="Получаем котировки...";
 try{
 const capital=Number($("capital").value),min=Number($("minimum").value),reserve=Number($("transfer").value),mode=$("mode").value;
 const fees=[Number($("gateFee").value)/100,Number($("bybitFee").value)/100];
 if(!(capital>0&&reserve>=0&&Number.isFinite(min)&&fees.every(f=>f>=0&&f<1)))throw Error("Проверьте параметры");
 const data=await Promise.allSettled([gate(),bybit()]);
 const gs=data.map((d,i)=>d.status==="fulfilled"?graph(d.value,i,fees[i]):null);
 const candidates=[];let hidden=0;
 function add(type,coins,edges){const cross=edges.some(e=>e.i!==edges[0].i);const end=edges.reduce((v,e)=>v*e.rate,capital)-(cross?reserve:0);if(end>=capital*(1+min/100))candidates.push({type,coins,edges,cross,end});}
 for(let i=0;i<2;i++){const g=gs[i],h=gs[1-i];if(!g)continue;
 for(const [a,e] of g.get("USDT")||[]){
 if(h&&(mode==="all"||mode==="cross")){const f=h.get(a)?.get("USDT");if(f)add("Межбиржевой",["USDT",a,"USDT"],[e,f]);}
 for(const [j,k,type] of [[i,g,"Треугольный"],[1-i,h,"Комбинированный"]]){
 if(!k||!(mode==="all"||mode===(j===i?"triangle":"mixed")))continue;
 for(const [b,f] of k.get(a)||[]){if(b==="USDT"||b===a)continue;const z=k.get(b)?.get("USDT");if(z)add(type,["USDT",a,b,"USDT"],[e,f,z]);}
 }
 }}
 const backend=$("backend").value.trim(); const showUnknown=$("unverified").checked; if(!backend&&!showUnknown){hidden=candidates.filter(c=>c.cross).length;for(let n=candidates.length-1;n>=0;n--)if(candidates[n].cross)candidates.splice(n,1);}
 const networks=new Map(); async function route(coin,from){if(!backend)return null;const key=coin+":"+from;if(!networks.has(key)){const url=new URL(backend);if(url.protocol!=="https:")throw Error("Требуется HTTPS");url.searchParams.set("coin",coin);url.searchParams.set("from",names[from]);networks.set(key,request(url.href).catch(()=>null));}return networks.get(key);}
 const cards=[];
 candidates.sort((a,b)=>b.end-a.end);
 const cache=new Map();let passed=0,errors=0,thin=0;
 const batch=candidates.slice(0,20);
 for(let offset=0;offset<batch.length;offset+=4){
 await Promise.all(batch.slice(offset,offset+4).map(async c=>{
 try{
 const from=c.edges[0].i;const outbound=c.cross?await route(c.coins[1],from):null;const back=c.cross?await route("USDT",1-from):null;const valid=x=>x&&x.ok===true&&typeof x.fee==="number"&&x.fee>=0&&Number.isFinite(x.fee)&&typeof x.min==="number"&&x.min>=0&&typeof x.depositMin==="number"&&x.depositMin>=0;const confirmed=c.cross&&valid(outbound)&&valid(back);if(c.cross&&!confirmed&&!showUnknown){hidden++;return;}
 const books=await Promise.all(c.edges.map(e=>{const key=e.i+":"+e.x.symbol+":"+e.buy;if(!cache.has(key))cache.set(key,book(e));return cache.get(key);}));
 let amount=capital;const details=[];for(let n=0;n<c.edges.length;n++){const before=amount,e=c.edges[n];amount=fill(amount,books[n],e.buy,e.fee);if(amount===null){thin++;return;}const gross=amount/(1-e.fee);details.push({before,after:amount,price:e.buy?before/gross:gross/before});if(n===0&&confirmed){if(amount<outbound.min||amount<=outbound.fee||amount-outbound.fee<outbound.depositMin)return;amount-=outbound.fee;}}
 if(confirmed&&(amount<back.min||amount<=back.fee||amount-back.fee<back.depositMin))return;const end=amount-(c.cross?(confirmed?back.fee:reserve):0),pct=(end-capital)/capital*100;if(pct<min)return;passed++;
 const div=document.createElement("div");div.className="result";
 function line(t,tag="p"){const p=document.createElement(tag);p.textContent=t;div.append(p);return p;}
 line(c.type+" | "+(c.cross?(confirmed?"Сети и комиссии проверены; лимиты аккаунта не проверены":"НЕ ПОДТВЕРЖДЕНА СЕТЬ"):"Проверен стакан; не гарантия исполнения"),"small");
 line(c.coins.join(" → ")+" | "+c.edges.map(e=>names[e.i]).join(" → "));
 line("Расчётная прибыль после расходов: "+pct.toFixed(2)+"% / "+(end-capital).toFixed(2)+" USDT").className=c.cross&&!confirmed?"":"profit";
 line("Итог: "+end.toFixed(2)+" USDT");
 details.forEach((d,n)=>line(names[c.edges[n].i]+": "+d.before.toPrecision(8)+" "+c.coins[n]+" → "+d.after.toPrecision(8)+" "+c.coins[n+1]+" | средняя цена "+d.price.toPrecision(8)+" "+c.edges[n].x.quote+"/"+c.edges[n].x.base,"small"));
 c.edges.forEach((e,n)=>{const a=document.createElement("a");a.href=link(e);a.target="_blank";a.rel="noopener";a.style.color="#93c5fd";a.textContent=names[e.i]+": "+c.coins[n]+" → "+c.coins[n+1];div.append(a,document.createElement("br"));});
 if(confirmed){line("Перевод "+c.coins[1]+": "+outbound.network+" | комиссия "+outbound.fee+" "+c.coins[1]);line("Возврат USDT: "+back.network+" | комиссия "+back.fee+" USDT");line("Лимиты аккаунта, точность ордеров и изменение цены во время перевода не проверены.","small");}else if(c.cross){
 line("Полный цикл: вернуть USDT на "+names[c.edges[0].i]+". Резерв "+reserve+" USDT не является фактической комиссией.");
 for(const t of ["Одинаковая сеть и контракт монеты "+c.coins[1],"Вывод монеты открыт на первой бирже, ввод на второй","Обратный перевод USDT: сеть, ввод и вывод открыты","Проверены фактические комиссии, минимумы и лимиты"]){const l=document.createElement("label"),box=document.createElement("input");box.type="checkbox";box.style.width="auto";l.append(box,document.createTextNode(" "+t));div.append(l);}
 line("Ручные отметки не подтверждают прибыль автоматически.","small");
 }else line("Проверьте минимальные суммы, шаг количества и актуальность котировок.","small");
 cards.push({pct,div});
 }catch(e){errors++;}
 }));
 }
 cards.sort((a,b)=>b.pct-a.pct).forEach(x=>$("results").append(x.div));
 $("status").textContent=data.map((d,i)=>names[i]+": "+(d.status==="fulfilled"?d.value.length+" пар":"Ошибка "+d.reason.message)).join(" | ")+" | Скрыто неподтверждённых "+hidden+" | Кандидатов "+candidates.length+", проверено "+batch.length+", прошло "+passed+", недостаточно объёма "+thin+", ошибок стакана "+errors+" | "+new Date().toLocaleTimeString();
 if(!passed){$("results").textContent="Нет сигналов, прошедших проверку в этой выборке.";}
 }catch(e){$("status").textContent="Ошибка: "+e.message;}finally{busy=false;$("scan").disabled=false;}
}
</script></body></html>
