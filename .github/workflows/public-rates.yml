name: Public exchange rates
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '.github/workflows/public-rates.yml'
      - 'scripts/collect_rates.py'
permissions:
  contents: write
concurrency:
  group: public-rates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_rates.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.json
          git diff --cached --quiet || git commit -m 'Refresh public rates'
          git pull --rebase
          git push
